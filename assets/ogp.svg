<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">こてっちゃん | Profile &amp; About me</title>
  <desc id="desc">青空、黄緑、雲の白が重なる背景に、こてっちゃんの名前と「エロゲと投資が好きです。」の自己紹介。</desc>
  <defs>
    <radialGradient id="sky">
      <stop stop-color="#3e7cf0" stop-opacity=".52"/>
      <stop offset=".4" stop-color="#5798f5" stop-opacity=".3"/>
      <stop offset="1" stop-color="#6caaf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grass">
      <stop stop-color="#99e55a" stop-opacity=".58"/>
      <stop offset=".45" stop-color="#bcf66d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#bcf66d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="air">
      <stop stop-color="#6caaf6" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#e7f2fa" stop-opacity=".2"/>
      <stop offset="1" stop-color="#effcfd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light">
      <stop stop-color="#fff" stop-opacity=".86"/>
      <stop offset=".35" stop-color="#effcfd" stop-opacity=".45"/>
      <stop offset="1" stop-color="#effcfd" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f7faf6"/>
  <ellipse cx="1040" cy="150" rx="710" ry="430" fill="url(#sky)" transform="rotate(-24 1040 150)"/>
  <ellipse cx="150" cy="665" rx="670" ry="420" fill="url(#grass)" transform="rotate(-15 150 665)"/>
  <ellipse cx="1120" cy="700" rx="770" ry="390" fill="url(#air)" transform="rotate(-24 1120 700)"/>
  <ellipse cx="370" cy="180" rx="740" ry="170" fill="url(#light)" transform="rotate(-26 370 180)"/>
  <ellipse cx="950" cy="530" rx="650" ry="115" fill="url(#light)" transform="rotate(-24 950 530)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".035" style="mix-blend-mode:multiply"/>
  <g fill="#24313a" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
    <text x="112" y="145" fill="#52626a" font-size="19" letter-spacing="1.8">Profile &amp; About me</text>
    <text x="112" y="213" fill="#52626a" font-size="25" letter-spacing=".5">@mirinnano</text>
    <text x="105" y="340" font-size="104" font-weight="700" letter-spacing="-6">こてっちゃん<tspan fill="#315d86">.</tspan></text>
    <text x="112" y="410" font-size="28" letter-spacing=".8">エロゲと投資が好きです。</text>
  </g>
</svg>
